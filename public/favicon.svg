<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tm-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="tm-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003994" />
      <stop offset="100%" stop-color="#2575FC" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0052D4" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#subtle-shadow)">
    <!-- Outer TM Monogram Structure -->
    <!-- Left T Bar -->
    <path d="M 64,100 L 230,100 L 230,160 L 128,160 L 128,412 L 64,412 Z" fill="url(#tm-blue-grad)" />
    
    <!-- Central Interlocking M Chevron -->
    <path d="M 190,100 L 256,230 L 322,100 L 448,100 L 448,412 L 384,412 L 384,200 L 285,390 L 227,390 L 190,320 Z" fill="url(#tm-blue-grad)" />
    
    <!-- Right Accent Geometry -->
    <path d="M 384,100 L 448,100 L 448,412 L 384,412 Z" fill="url(#tm-accent-grad)" opacity="0.95" />
  </g>
</svg>
